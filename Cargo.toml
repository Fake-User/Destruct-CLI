[package]
name = "destruct-cli"
version = "0.2.7"
edition = "2024"
repository = "https://github.com/Fake-User/Destruct-CLI.git"

[profile.release]
codegen-units = 1
strip = true
lto = true

[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
reqwest = {version = "0.12.23", features = ["json"]}
serde = {version = "1.0.228", features = ["derive"]}
tokio = {version = "1.47.1", features = ["full"]}
tracing-subscriber = "0.3.20"
terminal_size = "0.4.3"
serde_json = "1.0.145"
tracing = "0.1.41"
s3sync = "1.49.0"
dirs = "6.0.0"
